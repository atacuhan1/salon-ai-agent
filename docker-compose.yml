services:
  postgres:
    image: postgres:16-alpine
    container_name: salon-postgres
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "5432:5432"
    volumes:
      - salon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  salon_pg_data:
